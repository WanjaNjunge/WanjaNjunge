<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="g2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#1c222b" stroke-width="1"/>
    </pattern>
    <clipPath id="disc-clip">
      <circle cx="200" cy="200" r="178"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#0d1117"/>

  <!-- Disc base -->
  <circle cx="200" cy="200" r="178" fill="#161b22"/>

  <!-- Subtle grid texture inside disc -->
  <rect x="22" y="22" width="356" height="356"
    fill="url(#g2)" opacity="0.7"
    clip-path="url(#disc-clip)"/>

  <!-- Concentric rings -->
  <g fill="none" stroke="#21262d">
    <circle cx="200" cy="200" r="140"/>
    <circle cx="200" cy="200" r="100"/>
    <circle cx="200" cy="200" r="60"/>
  </g>

  <!-- Node graph forming a "W" shape -->
  <!-- Original coords in 360×360 space, offset +20 for 400×400 centre -->
  <g stroke="#58a6ff" stroke-width="2" fill="#0d1117">
    <line x1="120" y1="140" x2="160" y2="260"/>
    <line x1="160" y1="260" x2="200" y2="170"/>
    <line x1="200" y1="170" x2="240" y2="260"/>
    <line x1="240" y1="260" x2="280" y2="140"/>

    <circle cx="120" cy="140" r="7"/>
    <circle cx="160" cy="260" r="7"/>
    <circle cx="240" cy="260" r="7"/>
    <circle cx="280" cy="140" r="7"/>

    <!-- Centre node highlighted -->
    <circle cx="200" cy="170" r="7" fill="#58a6ff"/>
  </g>

  <!-- Green status dot -->
  <circle cx="200" cy="310" r="3" fill="#3fb950"/>
</svg>
