<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#0d1117"/>

  <!-- Main disc -->
  <circle cx="200" cy="200" r="180" fill="#161b22"/>
  <circle cx="200" cy="200" r="179" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Arc A — blue, top quadrant, rotate -32° -->
  <!-- Circumference ≈ 2π×171 ≈ 1075; show ~1/3 arc = 358px -->
  <circle cx="200" cy="200" r="171"
    fill="none" stroke="#58a6ff" stroke-width="1"
    stroke-dasharray="358 717"
    stroke-dashoffset="179"
    opacity="0.85"
    transform="rotate(-32 200 200)"/>

  <!-- Arc B — green, opposite quadrant, rotate +35° -->
  <!-- Circumference ≈ 2π×157 ≈ 987; show ~1/3 arc = 329px -->
  <circle cx="200" cy="200" r="157"
    fill="none" stroke="#3fb950" stroke-width="1"
    stroke-dasharray="329 658"
    stroke-dashoffset="329"
    opacity="0.55"
    transform="rotate(35 200 200)"/>

  <!-- Monogram "Wn" -->
  <text x="200" y="258"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="148" font-weight="800"
    text-anchor="middle"
    letter-spacing="-9"
    fill="#e6edf3">W<tspan fill="#58a6ff">n</tspan></text>

  <!-- Bottom identifier -->
  <text x="200" y="328"
    font-family="'Courier New', Courier, monospace"
    font-size="11" letter-spacing="5"
    text-anchor="middle"
    fill="#58a6ff">WN · 001</text>
</svg>
